<!doctype html>
<html lang="en" class="dark">
  <head>
    <script>
      (function () {
        function isExt(src, msg, stack) {
          var s = String(src || '') + ' ' + String(stack || '');
          var m = String(msg || '');
          return (
            s.indexOf('chrome-extension://') !== -1 ||
            s.indexOf('moz-extension://') !== -1 ||
            m.indexOf('Failed to connect to MetaMask') !== -1
          );
        }
        window.addEventListener(
          'error',
          function (e) {
            if (isExt(e.filename, e.message, e.error && e.error.stack)) {
              e.preventDefault();
              e.stopImmediatePropagation();
            }
          },
          true
        );
        window.addEventListener(
          'unhandledrejection',
          function (e) {
            var r = e.reason;
            var msg = typeof r === 'string' ? r : r && r.message;
            var stack = r && r.stack;
            if (isExt('', msg, stack)) {
              e.preventDefault();
              e.stopImmediatePropagation();
            }
          },
          true
        );
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

      rel="stylesheet"
    />
  </head>
